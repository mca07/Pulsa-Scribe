name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # nur für die Veröffentlichung der APK als Release

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Tests (Zeitstempel, Antwortprüfung, Audio-Teile, Export, manipulierte Daten)
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Signierschlüssel aus Secrets bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.SCRIBE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/signing.p12"
            echo "SCRIBE_KEYSTORE_FILE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret SCRIBE_KEYSTORE_B64 fehlt – es wird nur eine Test-APK (Debug) gebaut."
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Release-APK bauen (signiert)
        if: env.SIGNED == '1'
        env:
          SCRIBE_KEYSTORE_PASSWORD: ${{ secrets.SCRIBE_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/release/app-release.apk Pulsa-Scribe.apk

      - name: Test-APK bauen (Debug, nur zum Ausprobieren)
        if: env.SIGNED != '1'
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          cp app/build/outputs/apk/debug/app-debug.apk Pulsa-Scribe-test.apk

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Pulsa-Scribe*.apk | grep -E "Signer|SHA-256" | head -4

      - name: Build-Fehler als Hinweise anzeigen
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/gradle.log" ]; then
            grep -E "FAILED|Test.*>|expected|error:|\.java:[0-9]+|What went wrong|Could not|AAPT|Execution failed" "$RUNNER_TEMP/gradle.log" \
              | grep -v -i "password\|keystore" | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Schlüsseldatei entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.p12"

      - name: APK als Build-Ergebnis ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Pulsa-Scribe-APK
          path: Pulsa-Scribe*.apk
          retention-days: 30

      - name: APK als Release "neueste" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls Pulsa-Scribe*.apk)
          gh release delete neueste --yes --cleanup-tag || true
          gh release create neueste "$APK" \
            --title "Pulsa Scribe – neueste Version (Build ${{ github.run_number }})" \
            --notes "Automatisch gebaut aus Commit ${{ github.sha }}. Zum Installieren die APK auf dem Handy öffnen." \
            --prerelease
